name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Windows → Voicy.exe ──────────────────────────────────────────────────────
  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Voicy.exe
          if-no-files-found: error

  # ── macOS → Voicy.dmg ────────────────────────────────────────────────────────
  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps
        run: brew install portaudio create-dmg

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec

      - name: Create DMG
        run: |
          # Exit 2: DMG was created but Finder bless/eject failed (common on CI).
          create-dmg \
            --volname "Voicy" \
            --window-pos 200 120 \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "Voicy.app" 125 120 \
            --hide-extension "Voicy.app" \
            --app-drop-link 375 120 \
            "Voicy.dmg" \
            "dist/Voicy.app" \
          || {
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          }
          test -f Voicy.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Voicy.dmg
          if-no-files-found: error

  publish:
    needs: [release-please, build-windows, build-macos]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            artifacts/windows-exe/Voicy.exe \
            artifacts/macos-dmg/Voicy.dmg \
            --clobber
